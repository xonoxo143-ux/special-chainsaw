name: HP F41 Official USB in WinPE v3

on:
  pull_request:
    branches: [main]

jobs:
  create-recovery:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Install image and VM tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf wimtools xorriso p7zip-full \
            dosfstools util-linux wget ca-certificates

      - name: Build WinPE and run HP USB creator
        id: official
        shell: bash
        run: |
          set -uo pipefail
          OUT="$PWD/f41-winpe-v3-output"
          WORK="$PWD/f41-winpe-v3-work"
          ISO="$WORK/windows.iso"
          ROOT="$WORK/iso-root"
          CUSTOM="$WORK/hp-winpe.iso"
          USB="$WORK/HP-86F3-F41-Official-Recovery.img"
          LOGIMG="$WORK/logs.img"
          USBMNT="$WORK/usb-mnt"
          LOGMNT="$WORK/log-mnt"
          mkdir -p "$OUT" "$WORK/outer" "$WORK/hp" "$ROOT" "$USBMNT" "$LOGMNT"

          cleanup() {
            set +e
            sudo umount "$USBMNT" >/dev/null 2>&1 || true
            sudo umount "$LOGMNT" >/dev/null 2>&1 || true
            [[ -n "${ULOOP:-}" ]] && sudo losetup -d "$ULOOP" >/dev/null 2>&1 || true
            [[ -n "${LLOOP:-}" ]] && sudo losetup -d "$LLOOP" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          WIN_URL='https://software-static.download.prss.microsoft.com/dbazure/988969d5-f34g-4e03-ac9d-1f9786c66750/19045.2006.220908-0225.22h2_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso'
          WIN_SHA='ef7312733a9f5d7d51cfa04ac497671995674ca5e1058d5164d6028f0938d668'
          wget -nv --progress=dot:giga "$WIN_URL" -O "$ISO" 2>&1 | tee "$OUT/windows-download.txt"
          echo "$WIN_SHA  $ISO" | sha256sum -c - | tee "$OUT/windows-iso-verify.txt"

          7z l "$ISO" | grep -Ei 'boot.wim|etfsboot|efisys|bootmgr' | tee "$OUT/iso-key-files.txt"
          7z x -y "$ISO" -o"$ROOT" 'boot/*' 'efi/*' 'bootmgr' 'bootmgr.efi' 'sources/boot.wim' | tee "$OUT/iso-extract.txt"
          find "$ROOT" -maxdepth 6 -type f -printf '%P\t%s\n' | sort | tee "$OUT/minimal-iso-tree.txt"
          test -f "$ROOT/sources/boot.wim"
          test -f "$ROOT/boot/etfsboot.com"
          test -f "$ROOT/efi/microsoft/boot/efisys.bin"

          wget -nv 'https://ftp.hp.com/pub/softpaq/sp141501-142000/sp141980.exe' -O "$WORK/sp141980.exe" 2>&1 | tee "$OUT/hp-download.txt"
          sha256sum "$WORK/sp141980.exe" | tee "$OUT/sp141980.sha256"
          7z x -y -o"$WORK/outer" "$WORK/sp141980.exe" | tee "$OUT/hp-extract.txt"
          HP_EXE="$(find "$WORK/outer" -type f -iname '086F3F41.EXE' | head -n1)"
          test -n "$HP_EXE"
          cp "$HP_EXE" "$WORK/hp/086F3F41.EXE"
          sha256sum "$WORK/hp/086F3F41.EXE" | tee "$OUT/hp-utility.sha256"

          wget -nv 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip' -O "$WORK/ahk.zip" 2>&1 | tee "$OUT/ahk-download.txt"
          7z x -y -o"$WORK/ahk" "$WORK/ahk.zip" >"$OUT/ahk-extract.txt"
          cp "$WORK/ahk/AutoHotkeyU64.exe" "$WORK/hp/AutoHotkey.exe"

          cat > "$WORK/hp/automate.ahk" <<'AHK'
          #NoEnv
          #SingleInstance Force
          SetBatchLines, -1
          SetTitleMatchMode, 2
          DetectHiddenWindows, On
          SendMode, Event
          global LogPath := "X:\HP\local-log.txt"

          FindLogDrive() {
            global LogPath
            DriveGet, Ds, List
            Loop, Parse, Ds
            {
              D := A_LoopField . ":"
              DriveGet, L, Label, %D%
              if (L = "HPLOGS")
                LogPath := D . "\hp-run.log"
            }
          }
          Log(M) {
            global LogPath
            FileAppend, %M%`r`n, %LogPath%
          }
          Dump() {
            WinGetTitle, T, A
            WinGet, C, ControlList, A
            WinGetText, X, A
            Log("---SCREEN---")
            Log("TITLE=[" . T . "]")
            Log("CONTROLS=[" . C . "]")
            Log("TEXT=[" . X . "]")
          }

          FindLogDrive()
          Log("BOOT")
          DriveGet, D0s, List
          Loop, Parse, D0s
          {
            D0 := A_LoopField . ":"
            DriveGet, L0, Label, %D0%
            DriveGet, T0, Type, %D0%
            Log("INITIAL_DRIVE=" . D0 . " LABEL=" . L0 . " TYPE=" . T0)
          }

          Run, X:\HP\086F3F41.EXE
          WinWait, 086F3F41, , 45
          if ErrorLevel
            WinWait, HP BIOS, , 20
          if ErrorLevel
          {
            Log("FAIL:NO_HP_WINDOW")
            RunWait, wpeutil shutdown
            ExitApp
          }
          WinActivate
          Sleep, 5000
          Dump()
          ControlClick, Next, A
          Sleep, 4000
          Dump()
          ControlClick, Create Recovery USB flash drive, A
          Sleep, 1500
          ControlClick, Next, A
          Sleep, 8000
          Dump()
          ControlGet, DL, List, , SysListView321, A
          Log("DRIVE_LIST=[" . DL . "]")
          ControlFocus, SysListView321, A
          Send, {Home}{Space}
          Sleep, 2000
          ControlClick, Next, A
          Sleep, 3500

          Last := ""
          Success := 0
          Loop, 120
          {
            WinGetTitle, TT, A
            WinGetText, TX, A
            if (TX != Last)
            {
              Log("STATE_TITLE=[" . TT . "]")
              Log("STATE_TEXT=[" . TX . "]")
              Last := TX
            }
            if InStr(TX, "successfully")
              Success := 1
            ControlClick, Yes, A
            ControlClick, OK, A
            ControlClick, Format, A
            Sleep, 2000
          }
          Log("SUCCESS_FLAG=" . Success)
          DriveGet, Ds, List
          Loop, Parse, Ds
          {
            D := A_LoopField . ":"
            DriveGet, L, Label, %D%
            DriveGet, Ty, Type, %D%
            Log("DRIVE=" . D . " LABEL=" . L . " TYPE=" . Ty)
            Loop, Files, %D%\*.*, R
              Log("FILE=" . A_LoopFileFullPath . " SIZE=" . A_LoopFileSize)
          }
          Dump()
          RunWait, wpeutil shutdown
          ExitApp
          AHK

          cat > "$WORK/startnet.cmd" <<'CMD'
          @echo off
          wpeinit
          timeout /t 10 /nobreak
          X:\HP\AutoHotkey.exe X:\HP\automate.ahk
          CMD

          wimlib-imagex info "$ROOT/sources/boot.wim" | tee "$OUT/boot-wim-info.txt"
          cat > "$WORK/wim-update.txt" <<EOF
          add "$WORK/hp" "\\HP"
          add "$WORK/startnet.cmd" "\\Windows\\System32\\startnet.cmd"
          EOF
          wimlib-imagex update "$ROOT/sources/boot.wim" 2 < "$WORK/wim-update.txt" | tee "$OUT/wim-update-output.txt"
          wimlib-imagex dir "$ROOT/sources/boot.wim" 2 --path=/HP | tee "$OUT/wim-hp-tree.txt"

          EFI_IMG='efi/microsoft/boot/efisys.bin'
          if [[ -f "$ROOT/efi/microsoft/boot/efisys_noprompt.bin" ]]; then
            EFI_IMG='efi/microsoft/boot/efisys_noprompt.bin'
          fi
          xorriso -as mkisofs \
            -iso-level 3 -full-iso9660-filenames -J -joliet-long -r \
            -V HPWINPE \
            -b boot/etfsboot.com -no-emul-boot -boot-load-size 8 -boot-info-table \
            -eltorito-alt-boot -e "$EFI_IMG" -no-emul-boot \
            -o "$CUSTOM" "$ROOT" 2>&1 | tee "$OUT/xorriso-build.txt"
          sha256sum "$CUSTOM" | tee "$OUT/custom-iso.sha256"

          make_disk() {
            local img="$1" size="$2" label="$3"
            truncate -s "$size" "$img"
            printf 'label: dos\nunit: sectors\n\nstart=2048, type=c, bootable\n' | sudo sfdisk "$img" >/dev/null
            local lp
            lp="$(sudo losetup --find --show --partscan "$img")"
            sudo mkfs.vfat -F 32 -n "$label" "${lp}p1" >/dev/null
            sudo losetup -d "$lp"
          }
          make_disk "$USB" 256M HPBIOS
          make_disk "$LOGIMG" 64M HPLOGS

          cp /usr/share/OVMF/OVMF_VARS_4M.fd "$WORK/OVMF_VARS.fd"
          set +e
          timeout 1200 qemu-system-x86_64 \
            -machine q35,accel=tcg -cpu max -smp 2 -m 3072 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file="$WORK/OVMF_VARS.fd" \
            -boot order=d \
            -drive if=none,id=cd,media=cdrom,readonly=on,file="$CUSTOM" \
            -device ide-cd,drive=cd \
            -device qemu-xhci,id=xhci \
            -drive if=none,id=usbmedia,file="$USB",format=raw,cache=unsafe \
            -device usb-storage,bus=xhci.0,drive=usbmedia,removable=on \
            -drive file="$LOGIMG",format=raw,if=ide,index=1,media=disk \
            -display none -serial file:"$OUT/qemu-serial.txt" -no-reboot \
            2>"$OUT/qemu-stderr.txt"
          QEMU_EXIT=$?
          set -e
          echo "$QEMU_EXIT" >"$OUT/qemu-exit.txt"

          ULOOP="$(sudo losetup --find --show --partscan "$USB")"
          LLOOP="$(sudo losetup --find --show --partscan "$LOGIMG")"
          sudo mount -o ro "${ULOOP}p1" "$USBMNT"
          sudo mount -o ro "${LLOOP}p1" "$LOGMNT"
          find "$USBMNT" -maxdepth 12 -printf '%y\t%P\t%s\n' | sort | tee "$OUT/usb-tree.txt"
          find "$USBMNT" -type f -print0 | sort -z | xargs -0 -r sha256sum | tee "$OUT/usb-files.sha256"
          find "$LOGMNT" -maxdepth 5 -printf '%y\t%P\t%s\n' | sort | tee "$OUT/log-tree.txt"
          mkdir -p "$OUT/logs"
          cp -a "$LOGMNT/." "$OUT/logs/" 2>/dev/null || true
          sudo fsck.vfat -vn "${ULOOP}p1" | tee "$OUT/usb-fsck.txt" || true
          sudo sfdisk -d "$USB" | tee "$OUT/usb-partition-table.txt"
          sha256sum "$USB" | tee "$OUT/usb-image.sha256"

          LOGFILE="$OUT/logs/hp-run.log"
          if grep -Eqi 'SUCCESS_FLAG=1|successfully' "$LOGFILE" 2>/dev/null \
             && grep -Eqi '086F3\.(bin|sig|b01|s01)' "$OUT/usb-tree.txt"; then
            cp "$USB" "$OUT/HP-86F3-F41-Official-Recovery.img"
            sha256sum "$OUT/HP-86F3-F41-Official-Recovery.img" >"$OUT/HP-86F3-F41-Official-Recovery.img.sha256"
            echo 'verified' >"$OUT/verified-success.txt"
            echo 'success=true' >>"$GITHUB_OUTPUT"
          else
            echo 'No verified HP success state; image withheld.' | tee "$OUT/failure.txt"
            echo 'success=false' >>"$GITHUB_OUTPUT"
          fi

      - name: Upload verified recovery image
        if: steps.official.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HP-86F3-F41-Official-Recovery-WinPE-v3
          path: f41-winpe-v3-output/HP-86F3-F41-Official-Recovery.img
          compression-level: 6
          retention-days: 7
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HP-F41-WinPE-v3-Diagnostics
          path: f41-winpe-v3-output
          compression-level: 6
          retention-days: 7
          if-no-files-found: warn
