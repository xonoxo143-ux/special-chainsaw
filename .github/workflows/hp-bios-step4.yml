name: HP BIOS Export Step 4

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-final-image:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check whether image exists
        id: check
        run: |
          if [[ -f probe-output/final/HP-86F3-F58-Recovery.img ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install tools
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosfstools fdisk mtools

      - name: Build FAT32 image
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SRC='probe-output/exported-default'
          OUT='probe-output/final'
          IMG="$OUT/HP-86F3-F58-Recovery.img"
          PART="$OUT/fat32-partition.img"
          mkdir -p "$OUT"
          rm -f "$IMG" "$PART"

          for f in 086F3.bin 086F3.sig 086F3.b01 086F3.s01; do test -f "$SRC/$f"; done
          test "$(stat -c %s "$SRC/086F3.bin")" = 16777216
          test "$(stat -c %s "$SRC/086F3.b01")" = 16777216
          test "$(stat -c %s "$SRC/086F3.sig")" = 256
          test "$(stat -c %s "$SRC/086F3.s01")" = 256
          sha256sum "$SRC"/086F3.* > "$OUT/exported-files.sha256"

          truncate -s 96M "$IMG"
          printf 'label: dos\nunit: sectors\n\nstart=2048, size=194560, type=c, bootable\n' | sfdisk "$IMG"
          truncate -s 95M "$PART"
          mkfs.vfat -F 32 -n HPBIOS "$PART"

          export MTOOLS_SKIP_CHECK=1
          mmd -i "$PART" ::/Hewlett-Packard
          mmd -i "$PART" ::/Hewlett-Packard/BIOS
          mmd -i "$PART" ::/Hewlett-Packard/BIOS/Current
          mmd -i "$PART" ::/Hewlett-Packard/BIOS/New
          for dir in ::/Hewlett-Packard/BIOS/Current ::/Hewlett-Packard/BIOS/New; do
            for f in 086F3.bin 086F3.sig 086F3.b01 086F3.s01; do
              mcopy -i "$PART" "$SRC/$f" "$dir/"
            done
          done

          printf '%s\n' \
            'HP BIOS Recovery Media' \
            'HP All-in-One 24-dp0014 / SSID 86F3' \
            'BIOS F.58 / SoftPaq SP172733' \
            'Signed files exported with the official HP utility.' > "$OUT/RECOVERY_INFO.txt"
          mcopy -i "$PART" "$OUT/RECOVERY_INFO.txt" ::/

          fsck.vfat -vn "$PART" > "$OUT/fat32-check.txt"
          {
            sfdisk -d "$IMG"
            echo
            mdir -i "$PART" ::/Hewlett-Packard/BIOS/Current
            echo
            mdir -i "$PART" ::/Hewlett-Packard/BIOS/New
          } > "$OUT/image-layout.txt"

          dd if="$PART" of="$IMG" bs=512 seek=2048 conv=notrunc status=none
          rm -f "$PART"
          test "$(stat -c %s "$IMG")" = 100663296
          sha256sum "$IMG" > "$OUT/HP-86F3-F58-Recovery.img.sha256"
          echo 'build_exit=0' > "$OUT/build-status.txt"
          ls -lh "$OUT"

      - name: Record failure
        if: failure() && steps.check.outputs.skip != 'true'
        run: |
          mkdir -p probe-output/final
          echo 'build_exit=1' > probe-output/final/build-status.txt

      - name: Commit image or status
        if: always() && steps.check.outputs.skip != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe-output/final
          git commit -m 'Build HP 86F3 F.58 recovery image' || true
          git push origin HEAD:${{ github.head_ref }}
