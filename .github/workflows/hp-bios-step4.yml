name: HP BIOS Export Step 4

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check completion
        id: check
        shell: pwsh
        run: |
          if (Test-Path probe-output/step4-complete.txt) { 'skip=true' >> $env:GITHUB_OUTPUT } else { 'skip=false' >> $env:GITHUB_OUTPUT }

      - name: Export BIOS files
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force step4-work, step4-work\outer, probe-output, probe-output\exported, C:\bios-export | Out-Null
          Invoke-WebRequest 'https://ftp.hp.com/pub/softpaq/sp172501-173000/sp172733.exe' -OutFile step4-work\sp172733.exe
          & 'C:\Program Files\7-Zip\7z.exe' x -y '-ostep4-work\outer' step4-work\sp172733.exe | Out-Null
          $exe = (Get-ChildItem step4-work\outer -Recurse -Filter '086F3F58.EXE' | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()

          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeMouse4 {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
          }
          '@
          function Root($proc) {
            $proc.Refresh()
            return [System.Windows.Automation.AutomationElement]::FromHandle($proc.MainWindowHandle)
          }
          function Find-ByName($root, [string]$name) {
            $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, $name)
            return $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
          }
          function Find-ById($root, [string]$id) {
            $c = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty, $id)
            return $root.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $c)
          }
          function Click-El($el, $hwnd) {
            if (-not $el) { throw 'Element not found for click' }
            $r = $el.Current.BoundingRectangle
            $x = [int]($r.X + $r.Width / 2)
            $y = [int]($r.Y + $r.Height / 2)
            [NativeMouse4]::SetForegroundWindow($hwnd) | Out-Null
            Start-Sleep -Milliseconds 300
            [NativeMouse4]::SetCursorPos($x,$y) | Out-Null
            [NativeMouse4]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
            [NativeMouse4]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
            Start-Sleep -Seconds 2
          }

          $root = Root $p
          Click-El (Find-ByName $root 'Next') $p.MainWindowHandle
          $root = Root $p
          Click-El (Find-ByName $root 'Copy') $p.MainWindowHandle
          $root = Root $p
          Click-El (Find-ByName $root 'Next') $p.MainWindowHandle
          $root = Root $p

          $edit = Find-ById $root '4004'
          if (-not $edit) { throw 'Destination path field not found' }
          $set = $false
          try {
            $vp = $edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
            $vp.SetValue('C:\bios-export')
            $set = $true
          } catch {}
          if (-not $set) {
            Click-El $edit $p.MainWindowHandle
            [System.Windows.Forms.SendKeys]::SendWait('^a')
            [System.Windows.Forms.SendKeys]::SendWait('C:\bios-export')
          }
          Start-Sleep -Seconds 1
          $root = Root $p
          Click-El (Find-ByName $root 'Next') $p.MainWindowHandle
          Start-Sleep -Seconds 20

          Get-ChildItem C:\bios-export -Recurse -Force | Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize | Out-File probe-output\step4-files.txt -Width 800
          Copy-Item C:\bios-export\* probe-output\exported -Recurse -Force -ErrorAction SilentlyContinue

          $root = Root $p
          if ($root) {
            $rows = @()
            $all = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
            foreach ($el in $all) {
              $c = $el.Current
              $rows += [pscustomobject]@{Name=$c.Name; AutomationId=$c.AutomationId; ClassName=$c.ClassName; Enabled=$c.IsEnabled; X=$c.BoundingRectangle.X; Y=$c.BoundingRectangle.Y; W=$c.BoundingRectangle.Width; H=$c.BoundingRectangle.Height}
            }
            $rows | Format-Table -AutoSize | Out-File probe-output\step4-ui.txt -Width 800
          }
          Get-Process 086F3F58 -ErrorAction SilentlyContinue | Stop-Process -Force
          'complete' | Out-File probe-output\step4-complete.txt

      - name: Commit exported files
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe-output
          git commit -m 'Export HP 86F3 F.58 BIOS files'
          git push origin HEAD:${{ github.head_ref }}
